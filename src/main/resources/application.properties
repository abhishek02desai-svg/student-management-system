spring.application.name=student-management-system
server.port=8080


# ==========================================
# DATABASE - PostgreSQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/test_springboot_student-management-system
spring.datasource.username=postgres
spring.datasource.password=root

spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# HIBERNATE - batch lazy loading (avoids N+1 on paged lists)
# ==========================================
spring.jpa.properties.hibernate.default_batch_fetch_size=50


# ==========================================
# REDIS CACHE
# (start Redis first:  docker run -d --name sms-redis -p 6379:6379 redis:7)
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.key-prefix=sms::
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false


# ==========================================
# JWT  (override the secret with the JWT_SECRET env variable in real use; min 32 characters)
# ==========================================
app.jwt.secret=${JWT_SECRET:sms-dev-only-secret-key-please-change-me-0123456789}
app.jwt.expiration-minutes=60


# ==========================================
# FILE UPLOAD (multipart)
# ==========================================
app.file.upload-dir=uploads/profile-images
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB


# ==========================================
# SWAGGER  ->  http://localhost:8080/swagger-ui.html
# ==========================================
springdoc.packages-to-scan=com.example.sms.controller
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
